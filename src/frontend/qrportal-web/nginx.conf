server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # A geolocalização é usada, sempre opt-in, na evidência de aceite dos termos.
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  # O frontend chama a API por caminho relativo (/api). Quem servir esta imagem precisa
  # encaminhar /api e /files para a API; caso contrário o SPA cai no fallback do index.html.

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|woff2|png|jpg|jpeg|webp|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
