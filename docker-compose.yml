name: qrportal

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qrportal
      POSTGRES_USER: qrportal
      POSTGRES_PASSWORD: qrportal_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrportal -d qrportal"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - qrportal_postgres:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: qrportal
      MINIO_ROOT_PASSWORD: qrportal_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - qrportal_minio:/data

volumes:
  qrportal_postgres:
  qrportal_minio:
